<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video Session | Peer Tutoring</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="video.css" />
</head>
<body class="call-body">

<div id="call-error" class="call-error" style="display:none;">
  <div class="call-error-card">
    <h2>Can't open this session</h2>
    <p id="call-error-text"></p>
    <a class="btn-primary btn-link" id="call-error-zoom" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">Join via Zoom Instead</a>
    <a class="btn-ghost btn-link" href="app.html?tab=chats">Back to Chats</a>
  </div>
</div>

<div id="call-shell" class="call-shell" style="display:none;">
  <header class="call-header">
    <div>
      <span class="call-partner" id="call-partner-name"></span>
      <span class="call-subject" id="call-subject"></span>
    </div>
    <span class="call-status" id="call-status">Setting up…</span>
  </header>

  <main class="call-stage">
    <video id="remote-video" class="video-slot video-slot-main" autoplay playsinline></video>
    <div class="waiting-overlay" id="waiting-overlay">
      <p id="waiting-text">Waiting for the other person to join…</p>
      <p class="waiting-hint">Demo tip: open this session in a second tab (or ask them to open their own tab) to test the call on this device.</p>
      <div class="zoom-fallback" id="zoom-fallback" style="display:none;">
        <p class="zoom-fallback-text">Trouble connecting?</p>
        <a class="btn-primary btn-link" id="zoom-fallback-link" href="#" target="_blank" rel="noopener noreferrer">Join via Zoom Instead</a>
      </div>
    </div>
    <video id="local-video" class="video-slot video-slot-pip" autoplay playsinline muted></video>
  </main>

  <footer class="call-controls">
    <button class="call-btn" id="toggle-mic" aria-pressed="false" aria-label="Mute microphone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4"/></svg>
    </button>
    <button class="call-btn" id="toggle-cam" aria-pressed="false" aria-label="Turn off camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </button>
    <button class="call-btn call-btn-leave" id="leave-call" aria-label="Leave call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a1 1 0 0 1 1.11-.21 12 12 0 0 0 3.76.6 1 1 0 0 1 1 1V19a1 1 0 0 1-1 1A17 17 0 0 1 3 5a1 1 0 0 1 1-1h2.97a1 1 0 0 1 1 1 12 12 0 0 0 .6 3.76 1 1 0 0 1-.25 1.11l-1.27 1.27a16 16 0 0 0 .63.66"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      Leave
    </button>
  </footer>
</div>

<script src="core.js"></script>
<script src="data.js"></script>
<script src="video.js"></script>
</body>
</html>
